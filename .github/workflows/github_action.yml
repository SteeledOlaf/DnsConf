name: DNS Block&Redirect Configurer cron task

on:
  schedule:
    # 04:30 по Москве (01:30 UTC)
    - cron: '30 1 * * *'

  # Возможность ручного запуска из GitHub Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # GitHub Environment с именем DNS
    environment: DNS

    env:
      DNS: ${{ vars.DNS }}
      BLOCK: ${{ vars.BLOCK }}
      REDIRECT: ${{ vars.REDIRECT }}
      EXCLUDE_REDIRECT: ${{ vars.EXCLUDE_REDIRECT }}
      DONOR_DNS: ${{ vars.DONOR_DNS }}

      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      TZ: Europe/Moscow

    steps:
      # ---------------------------------------------------------
      # 1. Получаем исходники
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # ---------------------------------------------------------
      # 2. Устанавливаем Java 26
      # ---------------------------------------------------------
      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # ---------------------------------------------------------
      # 3. Показываем версии Java и Maven
      # ---------------------------------------------------------
      - name: Show environment
        run: |
          java -version
          mvn -version

      # ---------------------------------------------------------
      # 4. Собираем проект
      # ---------------------------------------------------------
      - name: Build with Maven
        run: |
          mvn -B clean package

      # ---------------------------------------------------------
      # 5. Проверяем, что JAR действительно создан
      # ---------------------------------------------------------
      - name: Check built JAR
        run: |
          echo "Contents of target:"
          ls -lah target/

          if ! ls target/*.jar >/dev/null 2>&1; then
            echo "ERROR: JAR file was not created."
            exit 1
          fi

      # ---------------------------------------------------------
      # 6. Запускаем DnsConf
      # ---------------------------------------------------------
      - name: Run DnsConf
        run: |
          set -e

          echo "=========================================="
          echo "Starting DNS Block&Redirect Configurer"
          echo "=========================================="

          echo "Timezone: $TZ"
          echo "Java:"
          java -version

          echo "------------------------------------------"
          echo "Environment variables:"
          echo "DNS=${DNS:-<empty>}"
          echo "BLOCK=${BLOCK:-<empty>}"
          echo "REDIRECT=${REDIRECT:-<empty>}"
          echo "EXCLUDE_REDIRECT=${EXCLUDE_REDIRECT:-<empty>}"
          echo "DONOR_DNS=${DONOR_DNS:-<empty>}"
          echo "CLIENT_ID=<hidden>"
          echo "AUTH_SECRET=<hidden>"
          echo "------------------------------------------"

          JAR="$(find target -maxdepth 1 -type f -name '*.jar' | head -n 1)"

          echo "Using JAR: $JAR"
          echo "------------------------------------------"

          java --enable-preview -jar "$JAR"
