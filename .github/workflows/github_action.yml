name: DNS Block&Redirect Configurer cron task

on:
  schedule:
    # Каждые 6 часов: 03:17, 09:17, 15:17 и 21:17 по Москве.
    - cron: '17 */6 * * *'

  # Возможность ручного запуска из GitHub Actions
  workflow_dispatch:
    inputs:
      apply_dns:
        description: Apply the resulting configuration to DNS providers
        required: true
        default: false
        type: boolean
      dry_run:
        description: Build a reconciliation plan without changing DNS providers
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dnsconf-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # GitHub Environment с именем DNS
    environment: DNS

    steps:
      # ---------------------------------------------------------
      # 1. Получаем исходники
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      # ---------------------------------------------------------
      # 2. Устанавливаем Java 25 LTS
      # ---------------------------------------------------------
      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # ---------------------------------------------------------
      # 3. Показываем версии Java и Maven
      # ---------------------------------------------------------
      - name: Show environment
        run: |
          java -version
          mvn -version

      # ---------------------------------------------------------
      # 4. Собираем проект
      # ---------------------------------------------------------
      - name: Build with Maven
        run: |
          mvn -B clean verify

      - name: Static analysis
        run: |
          mvn -B spotbugs:check

      # ---------------------------------------------------------
      # 5. Проверяем, что JAR действительно создан
      # ---------------------------------------------------------
      - name: Check built JAR
        run: |
          echo "Contents of target:"
          ls -lah target/

          if ! ls target/*.jar >/dev/null 2>&1; then
            echo "ERROR: JAR file was not created."
            exit 1
          fi

      # ---------------------------------------------------------
      # 6. Запускаем DnsConf
      # ---------------------------------------------------------
      - name: Run DnsConf
        if: github.event_name == 'schedule' || inputs.apply_dns == true || inputs.dry_run == true
        env:
          DNS: ${{ vars.DNS }}
          BLOCK: ${{ vars.BLOCK }}
          REDIRECT: ${{ vars.REDIRECT }}
          EXCLUDE_REDIRECT: ${{ vars.EXCLUDE_REDIRECT }}
          DONOR_DNS: ${{ vars.DONOR_DNS }}
          ALLOW_CLEAR: ${{ vars.ALLOW_CLEAR }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.DRY_RUN }}
          DNSCONF_OWNER_ID: ${{ vars.DNSCONF_OWNER_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          TZ: Europe/Moscow
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Starting DNS Block&Redirect Configurer"
          echo "=========================================="

          echo "Timezone: $TZ"
          echo "Java:"
          java -version

          echo "------------------------------------------"
          echo "Configuration summary:"
          echo "DNS=${DNS:-<empty>}"
          echo "BLOCK configured: $([ -n "${BLOCK:-}" ] && echo yes || echo no)"
          echo "REDIRECT configured: $([ -n "${REDIRECT:-}" ] && echo yes || echo no)"
          echo "EXCLUDE_REDIRECT configured: $([ -n "${EXCLUDE_REDIRECT:-}" ] && echo yes || echo no)"
          echo "DONOR_DNS configured: $([ -n "${DONOR_DNS:-}" ] && echo yes || echo no)"
          echo "ALLOW_CLEAR=${ALLOW_CLEAR:-false}"
          echo "DRY_RUN=${DRY_RUN:-false}"
          echo "CLIENT_ID=<hidden>"
          echo "AUTH_SECRET=<hidden>"
          echo "------------------------------------------"

          mapfile -t JARS < <(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' -print)

          if [ "${#JARS[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one runnable JAR, found ${#JARS[@]}."
            printf '%s\n' "${JARS[@]}"
            exit 1
          fi

          JAR="${JARS[0]}"

          echo "Using JAR: $JAR"
          echo "------------------------------------------"

          java -jar "$JAR"
